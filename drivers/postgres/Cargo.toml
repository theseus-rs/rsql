[package]
authors.workspace = true
categories.workspace = true
description = "rsql postgres driver"
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "rsql_driver_postgres"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
bit-vec = { workspace = true }
file_type = { workspace = true }
jiff = { workspace = true }
postgresql_embedded = { workspace = true }
rsql_driver = { path = "../../rsql_driver", version = "0.19.4", features = ["json"] }
rsql_driver_postgresql = { path = "../postgresql", default-features = false, version = "0.19.4" }
rust_decimal = { workspace = true, features = ["db-tokio-postgres"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sqlparser = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-postgres = { workspace = true, features = ["array-impls", "with-bit-vec-0_6", "with-jiff-0_2", "with-serde_json-1", "with-uuid-1"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = ["tls-native-tls"]
tls-native-tls = [
    "postgresql_embedded/tls-native-tls",
]
tls-rustls-aws-lc-rs = [
    "postgresql_embedded/tls-rustls-aws-lc-rs",
]
tls-rustls-ring = [
    "postgresql_embedded/tls-rustls-ring",
]

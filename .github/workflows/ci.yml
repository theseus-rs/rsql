name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  build:
    name: ${{ matrix.platform }}
    needs: [ checks ]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-arm
          - linux-x64
          - macos-arm
          - macos-x64
          - windows-arm
          - windows-x64
          # - wasm32-unknown
          # - wasm32-wasi

        include:
          - platform: linux-arm
            os: ubuntu-24.04-arm
            rustflags: "-C link-arg=-fuse-ld=lld"
            target: aarch64-unknown-linux-gnu
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm
            os: macos-26
            target: aarch64-apple-darwin
          - platform: macos-x64
            os: macos-26-intel
            target: x86_64-apple-darwin
          - platform: windows-arm
            os: windows-11-arm
            rustflags: "-C link-arg=/ignore:4099"
            target: aarch64-pc-windows-msvc
          - platform: windows-x64
            os: windows-latest
            rustflags: "-C link-arg=/ignore:4099"
            target: x86_64-pc-windows-msvc
          # - platform: wasm32-unknown
          #   os: ubuntu-latest
          #   target: wasm32-unknown-unknown
          # - platform: wasm32-wasi
          #   os: ubuntu-latest
          #   target: wasm32-wasip1-threads

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      # aws-lc-rs requires nasm: https://github.com/rustls/rustls/issues/1913
      - name: Install NASM
        if: ${{ startsWith(matrix.platform, 'windows-') }}
        run: choco install nasm --yes --no-progress

      # GNU ld can exceed the AArch64 branch range when linking the all-features
      # test binary. LLD inserts the necessary range-extension thunks.
      - name: Install LLVM linker
        if: ${{ matrix.platform == 'linux-arm' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes lld

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@main
        with:
          tool: cargo-llvm-cov

      - name: Build
        if: ${{ startsWith(matrix.platform, 'wasm') }}
        timeout-minutes: 120
        env:
          CARGO_TERM_COLOR: always
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          RUST_BACKTRACE: 1
          RUST_LOG: info
        run: |
          sudo apt-get install gcc-multilib
          rustup target install ${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *"unknown"* ]]; then
            export RUSTFLAGS='--cfg getrandom_backend="wasm_js"'
          fi
          cargo build --package rsql_driver --target ${{ matrix.target }}
          cargo build --package rsql_drivers --features all-wasm --target ${{ matrix.target }}
          cargo build --package rsql_formatters --target ${{ matrix.target }}

      - name: Test
        if: ${{ matrix.platform != 'linux-x64' && !startsWith(matrix.platform, 'wasm') }}
        timeout-minutes: ${{ matrix.platform == 'windows-arm' && 360 || 120 }}
        env:
          CARGO_TERM_COLOR: always
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          RUST_BACKTRACE: 1
          RUST_LOG: "info"
          RUST_LOG_SPAN_EVENTS: full
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: |
          cargo test --workspace --features all --jobs 2

      - name: Test
        if: ${{ matrix.platform == 'linux-x64' }}
        timeout-minutes: 120
        env:
          CARGO_TERM_COLOR: always
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          RUST_BACKTRACE: 1
          RUST_LOG: "info"
          RUST_LOG_SPAN_EVENTS: full
        run: |
          cargo llvm-cov --workspace --lcov --jobs 1 --output-path lcov.info

      - name: Upload to codecov.io
        if: ${{ matrix.platform == 'linux-x64' }}
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

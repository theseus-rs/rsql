[workspace]
default-members = [
    "drivers/*",
    "rsql_cli",
    "rsql_core",
    "rsql_driver",
    "rsql_drivers",
    "rsql_formatters",
    "rsql_repl",
]
members = [
    "drivers/*",
    "examples/*",
    "rsql_cli",
    "rsql_core",
    "rsql_driver",
    "rsql_drivers",
    "rsql_formatters",
    "rsql_repl",
]
resolver = "3"

[workspace.package]
authors = ["Brian Heineman <brian.heineman@gmail.com>"]
categories = ["command-line-interface", "command-line-utilities", "database"]
edition = "2024"
keywords = ["database", "mysql", "postgresql", "sql", "sqlite"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/theseus-rs/rsql"
rust-version = "1.97.1"
version = "0.20.0"

[workspace.dependencies]
ansi_colours = "1.2.3"
anyhow = "1.0.104"
arboard = "3.6.1"
arrow-array = "58.3.0"
arrow-flight = "58.3.0"
async-trait = "0.1.91"
axoupdater = "0.10.0"
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }
aws-config = { version = "1.9.0", features = ["behavior-version-latest"] }
# Required for cross builds: https://aws.github.io/aws-lc-rs/platform_support.html
aws-lc-rs = { version = "1.17.3", features = ["bindgen"] }
aws-sdk-dynamodb = { version = "1.117.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.138.1", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
base64 = "0.22.1"
bigdecimal = "0.4.10"
bit-vec = "0.6.3"
brotli = "8.0.4"
bzip2 = "0.6.1"
calamine = "0.36.0"
chrono = "0.4.41"
clap = "4.6.3"
clap-stdin = "0.8.1"
clearscreen = "4.0.6"
clickhouse = "0.15.1"
colored = "3.1.1"
config = "0.15.25"
criterion = "0.8.2"
csv = "1.4.0"
dark-light = "2.0.0"
dirs = "6.0.0"
dotenvy = "0.15.7"
duckdb = "1.10504.0"
expectrl = "0.9.0"
file_type = "0.9.0"
flate2 = "1.1.9"
form_urlencoded = "1.2.2"
futures-util = "0.3.33"
getrandom = "0.4.3"
i18n_inflector = "0.4.1"
icu = "2.2.0"
jiff-icu = "0.2.2"
indexmap = "2.14.0"
indicatif = "0.18.6"
indoc = "2.0.7"
inquire = "0.9.4"
jiff = "0.2.34"
jwt-simple = { version = "0.12.17", default-features = false }
liblzma = "0.4.7"
libsql = { version = "0.9.30", default-features = false, features = ["core", "remote", "replication", "sync"] }
lz4 = "1.28.1"
mockall = "0.15.0"
orc-rust = { version = "0.8.0", default-features = false }
os_info = "3.15.0"
polars = { version = "0.54.4", default-features = false, features = ["dtype-categorical"] }
polars-sql = "0.54.4"
percent-encoding = "2.3.2"
postgresql_embedded = { version = "0.21.0", default-features = false, features = ["theseus"] }
quick-xml = "0.41.0"
rcgen = "0.14.5"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false }
rusqlite = "0.38.0"
rust_decimal = "1.42.1"
rust-i18n = "4.2.1"
rustls = { version = "0.23.42", default-features = false }
rustls-native-certs = "0.8.4"
rustyline = "18.0.1"
serde = "1.0.229"
serde_json = "1.0.151"
serde-saphyr = "0.0.29"
scylla = { version = "1.7.0", default-features = false, features = ["bigdecimal-04", "chrono-04", "num-bigint-04", "rustls-023", "unstable-client-routes"] }
sha2 = "0.11.0"
sqlx = "0.9.0"
sqlparser = "0.62.0"
supports-color = "3.0.2"
sys-locale = "0.3.2"
syntect = "5.3.0"
tabled = { version = "0.21.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
termbg = "0.6.2"
test-log = "0.2.21"
testcontainers = "0.27.3"
testcontainers-modules = "0.15.0"
thiserror = "2.0.19"
tiberius = { version = "0.12.3", default-features = false }
tokio = "1.53.1"
tokio-postgres = "0.7.18"
tokio-util = "0.7.19"
tonic = "0.14.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-indicatif = "0.3.14"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
url = "2.5.8"
uuid = "1.24.0"
wiremock = "0.6.5"
zstd = "0.13.3"

[workspace.lints.rust]
dead_code = "allow"
missing_debug_implementations = "deny"
unsafe_code = "deny"
unused_qualifications = "deny"
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
expect_used = "deny"
fallible_impl_from = "deny"
indexing_slicing = "deny"
large_stack_arrays = "allow"
mod_module_files = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.release]
shared-version = true
dependent-version = "upgrade"
tag-name = "v{{version}}"

[workspace]
default-members = [
    "drivers/*",
    "rsql_cli",
    "rsql_core",
    "rsql_driver",
    "rsql_drivers",
    "rsql_formatters",
    "rsql_repl",
]
members = [
    "drivers/*",
    "examples/*",
    "rsql_cli",
    "rsql_core",
    "rsql_driver",
    "rsql_drivers",
    "rsql_formatters",
    "rsql_repl",
]
resolver = "3"

[workspace.package]
authors = ["Brian Heineman <brian.heineman@gmail.com>"]
categories = ["command-line-interface", "command-line-utilities", "database"]
edition = "2024"
keywords = ["database", "mysql", "postgresql", "sql", "sqlite"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/theseus-rs/rsql"
rust-version = "1.97.1"
version = "0.21.0"

[workspace.dependencies]
ansi_colours = "1.2.3"
anyhow = "1.0.104"
arboard = "3.6.1"
arrow-array = "60.0.0"
arrow-flight = "60.0.0"
async-trait = "0.1.92"
axoupdater = "0.10.2"
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
# Required for cross builds: https://aws.github.io/aws-lc-rs/platform_support.html
aws-lc-rs = { version = "1.18.1", features = ["bindgen"] }
aws-sdk-dynamodb = { version = "1.128.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.150.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
base64 = "0.23.1"
bigdecimal = "0.4.10"
# tokio-postgres supports bit-vec through 0.9.
bit-vec = "0.9.1"
brotli = "9.0.0"
bzip2 = "0.6.1"
calamine = "0.36.1"
chrono = "0.4.45"
clap = "4.6.7"
clap-stdin = "0.8.1"
clearscreen = "4.0.6"
clickhouse = "0.15.2"
colored = "3.1.1"
config = "0.15.26"
criterion = "0.8.2"
csv = "1.4.0"
dark-light = "3.0.0"
dirs = "7.0.0"
dotenvy = "0.15.7"
duckdb = "1.10505.0"
expectrl = "0.9.0"
file_type = "0.9.0"
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
getrandom = "0.4.3"
i18n_inflector = "0.4.1"
icu = "2.3.1"
jiff-icu = "0.2.2"
indexmap = "2.14.2"
indicatif = "0.18.6"
indoc = "2.0.7"
inquire = "0.9.4"
jiff = "0.2.37"
jwt-simple = { version = "0.15.0", default-features = false }
liblzma = "0.4.8"
lz4 = "1.28.1"
mockall = "0.15.0"
orc-rust = { version = "0.9.0", default-features = false }
os_info = "3.15.0"
polars = { version = "0.55.2", default-features = false, features = ["dtype-categorical"] }
polars-sql = "0.55.2"
percent-encoding = "2.3.2"
postgresql_embedded = { version = "0.21.0", default-features = false, features = ["theseus"] }
quick-xml = "0.42.0"
rcgen = "0.14.10"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
ristretto_vm = { version = "0.34.0", default-features = false }
ristretto_resolver = { version = "0.34.0", default-features = false }
# sqlx 0.9 requires libsqlite3-sys <0.38, shared with rusqlite.
rusqlite = "0.39.0"
rust_decimal = "1.43.0"
rust-i18n = "4.2.2"
rustls = { version = "0.23.45", default-features = false }
rustls-native-certs = "0.8.4"
rustyline = "18.0.1"
send_wrapper = "0.6.0"
serde = "1.0.229"
serde_json = "1.0.151"
serde-saphyr = "1.3.0"
scylla = { version = "1.9.0", default-features = false, features = ["bigdecimal-04", "chrono-04", "num-bigint-04", "rustls-023", "unstable-client-routes"] }
sha2 = "0.11.0"
sqlx = "0.9.0"
sqlparser = "0.63.0"
static_vcruntime = "3.0.0"
supports-color = "3.0.2"
sys-locale = "0.3.2"
syntect = "5.3.0"
tabled = { version = "0.22.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
termbg = "0.6.2"
test-log = "0.2.21"
testcontainers = "0.27.3"
testcontainers-modules = "0.15.0"
thiserror = "2.0.21"
tiberius = { version = "0.13.0", default-features = false }
tokio = "1.53.1"
tokio-postgres = "0.7.18"
tokio-util = "0.7.19"
tonic = "0.14.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-indicatif = "0.3.14"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
url = "2.5.8"
uuid = "1.26.1"
winres = "0.1.12"
wiremock = "0.6.5"
zstd = "0.14.0"

[workspace.lints.rust]
dead_code = "allow"
missing_debug_implementations = "deny"
unsafe_code = "deny"
unused_qualifications = "deny"
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
expect_used = "deny"
fallible_impl_from = "deny"
indexing_slicing = "deny"
large_stack_arrays = "allow"
mod_module_files = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.release]
shared-version = true
dependent-version = "upgrade"
tag-name = "v{{version}}"
